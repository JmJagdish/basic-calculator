<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      🌙
    </button>
    
    <!-- Display -->
    <div class="display">
      <div id="previousDisplay"></div>
      <div id="currentDisplay">0</div>
    </div>

    <!-- Calculator Buttons -->
    <div class="buttons">

      <button type="button" class="btn btn-clear" data-action="AC">AC</button>
      <button type="button" class="btn btn-delete" data-action="DEL">DEL</button>
      <button type="button" class="btn operator" data-action="%">%</button>
      <button type="button" class="btn operator" data-action="÷">÷</button>

      <button type="button" class="btn" data-action="7">7</button>
      <button type="button" class="btn" data-action="8">8</button>
      <button type="button" class="btn" data-action="9">9</button>
      <button type="button" class="btn operator" data-action="×">×</button>

      <button type="button" class="btn" data-action="4">4</button>
      <button type="button" class="btn" data-action="5">5</button>
      <button type="button" class="btn" data-action="6">6</button>
      <button type="button" class="btn operator" data-action="−">−</button>

      <button type="button" class="btn" data-action="1">1</button>
      <button type="button" class="btn" data-action="2">2</button>
      <button type="button" class="btn" data-action="3">3</button>
      <button type="button" class="btn operator" data-action="+">+</button>

      <button type="button" class="btn" data-action="0">0</button>
      <button type="button" class="btn" data-action=".">.</button>
      <button type="button" class="btn btn-equal" data-action="=">=</button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
